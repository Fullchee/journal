# CI secrets scan (.github/workflows/secrets.yml). Pre-commit still runs detect-secrets.
title = "journal-native"

[extend]
useDefault = true

# The Worker's Google Calendar credentials; the default rules catch them only beside a key name like "secret" or "token".
[[rules]]
id = "google-oauth-client-secret"
description = "Google OAuth client secret"
regex = '''\b(GOCSPX-[A-Za-z0-9_-]{28})\b'''
secretGroup = 1
keywords = ["gocspx-"]

[[rules]]
id = "google-oauth-refresh-token"
description = "Google OAuth refresh token"
regex = '''\b(1//0[A-Za-z0-9_-]{40,})'''
secretGroup = 1
keywords = ["1//0"]

# One inline syntax for both scanners while pre-commit stays on detect-secrets.
[[allowlists]]
description = "Lines already audited for detect-secrets"
regexTarget = "line"
regexes = ['''pragma: allowlist secret''']

# Mirrors should_exclude_file in .secrets.baseline; the baseline itself holds hashes, not secrets.
[[allowlists]]
description = "Third-party exports and scanner state"
paths = [
  '''^\.agents/''',
  '''^tools/oxlint/anti-slop/''',
  '''^bun\.lock$''',
  '''^skills-lock\.json$''',
  '''^\.secrets\.baseline$''',
]
