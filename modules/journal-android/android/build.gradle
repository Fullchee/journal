plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.fullchee.journal'
version = '1.0.0'

android {
  namespace "expo.modules.journalandroid"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  testImplementation 'junit:junit:4.13.2'
  // android.jar only stubs org.json, so JVM unit tests need the real library.
  testImplementation 'org.json:json:20240303'
}
